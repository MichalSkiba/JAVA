name: Java 21 modules build
on:
  push:
    branches: [master, 'upgrade/**']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [WawFuel, bootsample]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '${{ matrix.module }}/pom.xml'
      - run: mvn -B --no-transfer-progress -f ${{ matrix.module }}/pom.xml -DskipTests clean package
